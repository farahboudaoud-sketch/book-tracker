<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="petal">
      <ellipse cx="0" cy="-19" rx="9" ry="17" fill="#5C7A5E"/>
      <ellipse cx="0" cy="-22" rx="4" ry="10" fill="#8FA998" opacity="0.7"/>
    </g>
    <g id="flower">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(60)"/>
      <use href="#petal" transform="rotate(120)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(240)"/>
      <use href="#petal" transform="rotate(300)"/>
      <circle r="8" fill="#C9D6BF"/>
      <circle r="4" fill="#3B5942"/>
    </g>
    <g id="leaf">
      <path d="M0,0 C6,-14 22,-14 28,0 C22,14 6,14 0,0 Z" fill="#446B4C"/>
      <path d="M2,0 C8,-8 20,-8 26,0" stroke="#8FA998" stroke-width="1.4" fill="none" opacity="0.6"/>
    </g>
  </defs>

  <rect width="240" height="240" fill="#1F2A24"/>

  <path d="M-10,120 C60,55 180,185 250,120" stroke="#33493B" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M120,-10 C55,60 185,180 120,250" stroke="#33493B" stroke-width="2.5" fill="none" opacity="0.55"/>

  <g transform="translate(60,60) scale(0.95)"><use href="#flower"/></g>
  <g transform="translate(180,60) scale(0.95)"><use href="#flower"/></g>
  <g transform="translate(60,180) scale(0.95)"><use href="#flower"/></g>
  <g transform="translate(180,180) scale(0.95)"><use href="#flower"/></g>
  <g transform="translate(120,120) scale(0.7)"><use href="#flower"/></g>

  <g transform="translate(120,60) rotate(90)"><use href="#leaf"/></g>
  <g transform="translate(150,120) rotate(180)"><use href="#leaf"/></g>
  <g transform="translate(120,180) rotate(-90)"><use href="#leaf"/></g>
  <g transform="translate(90,120)"><use href="#leaf"/></g>
</svg>
